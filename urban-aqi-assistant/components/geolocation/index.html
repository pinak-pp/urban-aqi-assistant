<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent;
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #btn {
    display: inline-block; padding: 6px 16px; border-radius: 8px;
    border: 1px solid #5b6c85; background: #2b6cb0; color: #ffffff;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #btn:hover { background: #2c5282; }
  #btn:focus-visible {
    outline: 3px solid #63b3ed; outline-offset: 2px;
  }
  #status { font-size: 12px; color: #888; margin-left: 8px; }
</style>
</head>
<body>
<button id="btn" type="button"
        aria-label="Share my current location to find nearby air quality stations">
  Locate me (GPS)
</button>
<span id="status" role="status" aria-live="polite"></span>
<script>
  function sendToStreamlit(type, data) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in (data || {})) { msg[k] = data[k]; }
    window.parent.postMessage(msg, "*");
  }
  function setFrameHeight(h) {
    sendToStreamlit("streamlit:setFrameHeight", { height: h });
  }
  function sendValue(value) {
    sendToStreamlit("streamlit:setComponentValue", { value: value });
  }
  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }
  window.addEventListener("message", function (event) {
    var type = event.data.type;
    if (type === "streamlit:render") {
      // the parent script reruns after we send a value; keep the note visible
      var already = event.data.args && event.data.args.value;
      if (already && already.latitude) {
        setStatus("Location captured (accuracy " + Math.round(already.accuracy || 0) + " m)");
      }
    }
  });
  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  setFrameHeight(48);

  document.getElementById("btn").addEventListener("click", function () {
    if (!navigator.geolocation) {
      setStatus("This browser does not support geolocation");
      return;
    }
    setStatus("Requesting location - please allow it in the browser...");
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        var c = pos.coords;
        sendValue({
          latitude: c.latitude,
          longitude: c.longitude,
          accuracy: c.accuracy,
          ts: Date.now()
        });
        setStatus("Location captured (accuracy " + Math.round(c.accuracy) + " m)");
      },
      function (err) {
        if (err.code === 1) {
          setStatus("Permission denied - allow location access for this site");
        } else {
          setStatus("Could not get location: " + err.message);
        }
      },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
    );
  });
</script>
</body>
</html>
