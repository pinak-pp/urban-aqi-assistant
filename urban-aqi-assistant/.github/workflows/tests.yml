name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check all modules
        run: python -m py_compile app.py aqi_data.py advice.py cities.py geolocation.py
      - name: Run test suite
        run: pytest tests/ -q
